# 本库自己的 CI：每次 push 跑自检（行数预算、结构、链接、目录树、配置语法），再把安装脚本在三个栈上各冒烟一次。
# 规则见 CLAUDE.md；自检脚本 scripts/check.py 同时是本库的 Claude Code Stop 钩子（.claude/settings.json）。
name: check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 本库自检
        run: python3 scripts/check.py
      - name: 安装脚本冒烟测试（三个栈各装一次到临时目录）
        run: |
          for stack in typescript-react python go; do
            dir="$RUNNER_TEMP/$stack"
            mkdir -p "$dir" && git -C "$dir" init -q
            scripts/install.sh "$dir" "$stack" --with-migrations --with-contracts
            test -f "$dir/.github/workflows/security.yml"
            test -x "$dir/.claude/hooks/pre-write-secrets.sh"
            test "$(git -C "$dir" config core.hooksPath)" = .githooks
            python3 -m json.tool "$dir/.claude/settings.json" > /dev/null
          done
