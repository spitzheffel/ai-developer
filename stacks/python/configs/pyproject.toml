# Python 新项目基线：`uv init --package` 建出 src/<package>/__init__.py 后整份覆盖其 pyproject，改 name 与 dependencies，再执行 `uv sync`。
# 各项取舍与禁用项见 ../README.md 第 1 节、第 7 节。

[project]
name = "example"            # 改成真实包名，与 src/<package> 目录名一致；osv-scanner.toml 的 PackageOverrides 同改
version = "0.1.0"
# 只写下界不封上界：requires-python 同时约束可用语法与依赖解析范围
requires-python = ">=3.12"
dependencies = [
    # 运行依赖示例：一律用 `uv add <pkg>` 维护，禁手改本列表或 uv.lock
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[build-system]
# 必留：uv sync 据此把本包以 editable 装进环境；删掉即成虚拟项目（只装依赖不装本包），src layout 下 pytest、lint-imports 都 import 不到本包
# uv_build 按 name（- 换成 _）定位 src/<package>/__init__.py，该文件缺失时 uv sync 直接报错
requires = ["uv_build>=0.13,<0.14"]  # 上界封到下一个次版本：uv_build 与 uv 同一版本策略，次版本号升级可含破坏性变更
build-backend = "uv_build"

[dependency-groups]
# PEP 735 开发依赖组：`uv add --dev` 写入此处，`uv sync` 默认一并安装
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.14",
    "ruff>=0.8",
    "import-linter>=2.15",
]

[tool.ruff]
# ruff 全包 lint + format：禁再叠加 black/isort/flake8
line-length = 100
target-version = "py312"    # 与 requires-python 下界保持一致

[tool.ruff.lint]
# 用 extend-select 在默认集之上追加（select 会整体替换默认集），跨 ruff 版本行为稳定
extend-select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# 行长由 ruff format 兜底，lint 不重复报 E501
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 允许 re-export（F401）与非顶部 import（E402）
"__init__.py" = ["E402", "F401"]

[tool.ruff.format]
# double 即默认值，显式写死防止风格漂移
quote-style = "double"

[tool.pytest.ini_options]
# 用 ini_options 表以兼容 pytest<9；不与 pytest 9 的原生 [tool.pytest] 表并存
minversion = "8.0"
addopts = "-ra -q"          # -ra 汇总全部非通过项，-q 精简输出
testpaths = ["tests"]
asyncio_mode = "auto"       # pytest-asyncio：async 测试免写 @pytest.mark.asyncio
asyncio_default_fixture_loop_scope = "function"  # 显式写死：未设时 pytest-asyncio 每次运行都报 PytestDeprecationWarning

[tool.mypy]
# strict = true 等价 --strict（disallow_untyped_defs 等全套）；放宽在 overrides 按模块做
python_version = "3.12"
strict = true
warn_unused_configs = true  # overrides 段匹配不到任何文件时报警，防配置失效

[[tool.mypy.overrides]]
# 占位示例：替换成真实的无类型存根库，或整段删除；禁全局 ignore_missing_imports
module = ["somelibrary.*"]
ignore_missing_imports = true

[tool.importlinter]
# 依赖边界：契约即架构文档（层名本身就是分层说明），同时是 AI 的边界输入与 CI 门禁
# `uv run lint-imports` 违约即非零退出；只查静态 import，importlib 动态导入与运行时注入看不见
# 根包须可 import：上方 [build-system] 让 uv sync 以 editable 装入本包（删掉该表即报 Could not find package）
root_package = "example"              # 与 [project].name、src/<package> 目录名同改
exclude_type_checking_imports = true  # `if TYPE_CHECKING:` 下的类型引用不计（同 ../README.md 第 6 节坑 8）

[[tool.importlinter.contracts]]
# 层序照抄 ../README.md 第 3 节：上层可 import 任意下层，下层 import 上层即红
# 契约与 ignore_imports 例外合计 ≤15 条：规则多了会锁死架构，想加一条先看能不能删一条
name = "分层 api → services → models → core"
type = "layers"
containers = ["example"]              # 同 root_package；层名因此省去包前缀
layers = [
    "api",
    "services",
    "models",
    "core",
]
