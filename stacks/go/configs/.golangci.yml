# golangci-lint v2 配置。复制到 Go 项目根:golangci-lint run 检查,run --fix 同时修 lint 与格式。
# 选型理由与命令见 ../README.md 第 2、7 节;改过本文件后跑一次 golangci-lint run 确认能加载。
version: "2" # v2 必填字段,唯一合法值 "2"

linters:
  default: standard # 官方 standard 组:errcheck、govet、ineffassign、staticcheck、unused(gosimple/stylecheck 已并入 staticcheck)
  enable: # 在 standard 之上追加
    - gocritic # 可疑代码/性能/风格诊断,覆盖面最广的补充检查
    - revive # 命名与注释检查:抓包名 stutter、导出符号缺注释(见 README 第 6 节)
    - misspell # 注释与字符串里的英文拼写错误,可被 --fix 修复
    - depguard # 依赖边界:按 import 前缀禁跨域(README 第 1 节「依赖边界」),规则在下方 settings.depguard
  settings:
    govet:
      enable-all: true # 开全 govet 分析器,含默认关闭的 shadow(抓 := 意外遮蔽 err)
      disable:
        - fieldalignment # 纯内存对齐建议,噪音大于收益,关闭
    depguard:
      # 规则三重身份:给人看的架构文档 + 给 AI 读的边界输入 + CI 红灯。总数 ≤15 条,写不下说明边界该重划。
      # 坑:启用了 depguard 却没写 rules 时,它默认只放行标准库——不用就从 enable 里拿掉,别把 rules 删空。
      rules:
        order-boundary: # 规则名会出现在报错里;一个业务域一条,照抄改名
          list-mode: lax # 只拦 deny 命中的 import,其余放行
          files:
            - "**/internal/order/**" # 按绝对路径匹配,必须 **/ 开头;尾 ** 连子包与 _test.go 一起管(depguard 文档的 {**/,} 写法在 golangci-lint v2.15 实测不匹配)
          deny: # pkg 是纯字符串前缀:尾 $ 只配该包本身,尾 / 只配其子包;两条合用才不误伤 internal/username
            - pkg: example.com/app/internal/user$ # example.com/app 换成 go.mod 里的 module 路径
              desc: 跨域 import;在 order 里定义所需最小接口,由 cmd/<app>/main.go 注入 user 的实现
            - pkg: example.com/app/internal/user/
              desc: 跨域 import;在 order 里定义所需最小接口,由 cmd/<app>/main.go 注入 user 的实现

formatters: # v2 起格式化器与 linter 分离;golangci-lint fmt 执行,run 对格式只报不改
  enable:
    - gofumpt # gofmt 的严格超集:更一致的空行与字面量写法
    - goimports # 自动增删并分组 import
